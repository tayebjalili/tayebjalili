<svg width="1280" height="430" viewBox="0 0 1280 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tayeb Jalili futuristic build flow</title>
  <desc id="desc">A modern workflow panel showing how Tayeb Jalili turns real-world problems into deployed systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.5" stop-color="#07111f"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="line" x1="120" y1="218" x2="1160" y2="218" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#67e8f9" fill-opacity="0.11"/>
    </pattern>
    <style>
      .spark { animation: spark 3.4s ease-in-out infinite; }
      .spark2 { animation: spark 3.4s ease-in-out infinite 1s; }
      @keyframes spark { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1280" height="430" rx="34" fill="url(#bg)"/>
  <rect width="1280" height="430" rx="34" fill="url(#dots)"/>
  <rect x="54" y="48" width="1172" height="334" rx="30" fill="#07111f" fill-opacity="0.58" stroke="#164e63"/>

  <text x="640" y="104" text-anchor="middle" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="900">How I Turn Complexity Into Software</text>
  <text x="640" y="136" text-anchor="middle" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">A system is not just code. It is people, process, data, speed, and trust.</text>

  <path d="M154 224H1126" stroke="url(#line)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <circle class="spark" cx="412" cy="224" r="7" fill="#67e8f9" filter="url(#glow)"/>
  <circle class="spark2" cx="866" cy="224" r="7" fill="#a78bfa" filter="url(#glow)"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g>
      <circle cx="168" cy="224" r="42" fill="#020617" stroke="#67e8f9" stroke-width="2"/>
      <text x="168" y="219" text-anchor="middle" fill="#67e8f9" font-size="14" font-weight="900">01</text>
      <text x="168" y="240" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">DISCOVER</text>
      <text x="168" y="300" text-anchor="middle" fill="#cbd5e1" font-size="15">Understand the real workflow</text>
    </g>
    <g>
      <circle cx="404" cy="224" r="42" fill="#020617" stroke="#2dd4bf" stroke-width="2"/>
      <text x="404" y="219" text-anchor="middle" fill="#5eead4" font-size="14" font-weight="900">02</text>
      <text x="404" y="240" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">MODEL</text>
      <text x="404" y="300" text-anchor="middle" fill="#cbd5e1" font-size="15">Shape clean data and roles</text>
    </g>
    <g>
      <circle cx="640" cy="224" r="42" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
      <text x="640" y="219" text-anchor="middle" fill="#bae6fd" font-size="14" font-weight="900">03</text>
      <text x="640" y="240" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">BUILD</text>
      <text x="640" y="300" text-anchor="middle" fill="#cbd5e1" font-size="15">Create APIs and interfaces</text>
    </g>
    <g>
      <circle cx="876" cy="224" r="42" fill="#020617" stroke="#a78bfa" stroke-width="2"/>
      <text x="876" y="219" text-anchor="middle" fill="#ddd6fe" font-size="14" font-weight="900">04</text>
      <text x="876" y="240" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">OPERATE</text>
      <text x="876" y="300" text-anchor="middle" fill="#cbd5e1" font-size="15">Make daily work simpler</text>
    </g>
    <g>
      <circle cx="1112" cy="224" r="42" fill="#020617" stroke="#67e8f9" stroke-width="2"/>
      <text x="1112" y="219" text-anchor="middle" fill="#67e8f9" font-size="14" font-weight="900">05</text>
      <text x="1112" y="240" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="800">IMPROVE</text>
      <text x="1112" y="300" text-anchor="middle" fill="#cbd5e1" font-size="15">Refine with real feedback</text>
    </g>
  </g>

  <text x="640" y="356" text-anchor="middle" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" letter-spacing="5">FUTURE-READY DOES NOT MEAN COMPLEX - IT MEANS CLEAR</text>
</svg>
