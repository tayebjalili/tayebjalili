<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tayeb Jalili neon command banner</title>
  <desc id="desc">A futuristic neon command center banner for Tayeb Jalili, full-stack software developer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.45" stop-color="#07111f"/>
      <stop offset="1" stop-color="#03131f"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameGradient" x1="260" y1="165" x2="940" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 208) rotate(90) scale(170 430)">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.33"/>
      <stop offset="0.55" stop-color="#14b8a6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#22d3ee" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="34" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="34" fill="url(#coreGlow)"/>

  <path d="M78 76H326L362 112H838L874 76H1122" stroke="url(#cyanLine)" stroke-width="2"/>
  <path d="M78 344H326L362 308H838L874 344H1122" stroke="url(#cyanLine)" stroke-width="2"/>
  <path d="M154 112V86H236" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2"/>
  <path d="M1046 112V86H964" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2"/>
  <path d="M154 308V334H236" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2"/>
  <path d="M1046 308V334H964" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2"/>

  <g filter="url(#glow)" opacity="0.95">
    <ellipse cx="600" cy="210" rx="314" ry="92" stroke="#22d3ee" stroke-width="1.4" stroke-opacity="0.7"/>
    <ellipse cx="600" cy="210" rx="230" ry="152" stroke="#14b8a6" stroke-width="1.2" stroke-opacity="0.45" transform="rotate(-14 600 210)"/>
    <ellipse cx="600" cy="210" rx="372" ry="132" stroke="#0891b2" stroke-width="1.2" stroke-opacity="0.32" transform="rotate(9 600 210)"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="282" cy="164" r="5" fill="#22d3ee"/>
    <circle cx="918" cy="164" r="5" fill="#22d3ee"/>
    <circle cx="346" cy="292" r="4" fill="#14b8a6"/>
    <circle cx="854" cy="292" r="4" fill="#14b8a6"/>
    <circle cx="600" cy="90" r="4" fill="#67e8f9"/>
    <circle cx="600" cy="330" r="4" fill="#67e8f9"/>
  </g>

  <text x="600" y="132" text-anchor="middle" fill="#67e8f9" font-family="'Segoe UI', Arial, sans-serif" font-size="18" letter-spacing="6">
    SYSTEMS ARCHITECT // FULL-STACK DEVELOPER
  </text>
  <text x="600" y="224" text-anchor="middle" fill="url(#nameGradient)" font-family="'Segoe UI', Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="2">
    Tayeb Jalili
  </text>
  <text x="600" y="274" text-anchor="middle" fill="#cbd5e1" font-family="'Segoe UI', Arial, sans-serif" font-size="22" letter-spacing="1.5">
    Laravel APIs  -  React Cockpits  -  Data-Driven Workflow Engines
  </text>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#94a3b8">
    <text x="90" y="370">STATUS: BUILDING REAL-WORLD SYSTEMS</text>
    <text x="860" y="370">MODE: FUTURE-READY SOLUTIONS</text>
  </g>

  <g opacity="0.8">
    <rect x="72" y="58" width="10" height="10" fill="#22d3ee"/>
    <rect x="92" y="58" width="10" height="10" fill="#14b8a6"/>
    <rect x="112" y="58" width="10" height="10" fill="#0ea5e9"/>
    <rect x="1078" y="58" width="50" height="10" fill="#22d3ee" fill-opacity="0.25"/>
    <rect x="1038" y="58" width="28" height="10" fill="#14b8a6" fill-opacity="0.35"/>
  </g>
</svg>
