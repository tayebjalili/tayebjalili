<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tayeb Jalili holographic portfolio interface</title>
  <desc id="desc">A futuristic glassmorphism portfolio interface for Tayeb Jalili, full-stack software developer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="0.42" stop-color="#061826"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="auroraA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(294 120) rotate(57.5) scale(377 513)">
      <stop offset="0" stop-color="#00f5ff" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#14b8a6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1065 410) rotate(131) scale(420 467)">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.34"/>
      <stop offset="0.44" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="96" y1="72" x2="1184" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="name" x1="143" y1="190" x2="731" y2="255" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="0.42" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#67e8f9" stroke-opacity="0.055"/>
    </pattern>
    <style>
      .floatA { animation: floatA 6s ease-in-out infinite; }
      .floatB { animation: floatB 7s ease-in-out infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      @keyframes floatA { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
      @keyframes floatB { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(10px); } }
      @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1280" height="560" rx="38" fill="url(#bg)"/>
  <rect width="1280" height="560" rx="38" fill="url(#grid)"/>
  <rect width="1280" height="560" rx="38" fill="url(#auroraA)"/>
  <rect width="1280" height="560" rx="38" fill="url(#auroraB)"/>

  <path d="M86 108C86 76 112 50 144 50H1136C1168 50 1194 76 1194 108V452C1194 484 1168 510 1136 510H144C112 510 86 484 86 452V108Z" fill="#020617" fill-opacity="0.42" stroke="url(#stroke)" stroke-width="1.5"/>
  <path d="M134 114H464" stroke="#67e8f9" stroke-opacity="0.5"/>
  <path d="M816 114H1146" stroke="#a78bfa" stroke-opacity="0.38"/>

  <g class="floatA">
    <rect x="824" y="144" width="282" height="258" rx="28" fill="#07111f" fill-opacity="0.74" stroke="#67e8f9" stroke-opacity="0.36"/>
    <circle cx="965" cy="267" r="82" stroke="#67e8f9" stroke-opacity="0.22" stroke-width="18"/>
    <circle cx="965" cy="267" r="82" stroke="#2dd4bf" stroke-width="18" stroke-linecap="round" stroke-dasharray="360 180"/>
    <circle cx="965" cy="267" r="36" fill="#020617" stroke="#67e8f9" stroke-opacity="0.52"/>
    <text x="965" y="260" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">SYSTEM</text>
    <text x="965" y="288" text-anchor="middle" fill="#67e8f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" letter-spacing="3">BUILDER</text>
    <text x="965" y="355" text-anchor="middle" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Laravel - React - MySQL</text>
  </g>

  <g class="floatB" opacity="0.92">
    <rect x="694" y="362" width="220" height="86" rx="22" fill="#07111f" fill-opacity="0.75" stroke="#2dd4bf" stroke-opacity="0.38"/>
    <text x="724" y="397" fill="#5eead4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">CURRENT SIGNAL</text>
    <text x="724" y="426" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Real-world systems</text>
  </g>

  <g filter="url(#blurGlow)" class="pulse">
    <circle cx="1146" cy="114" r="5" fill="#a78bfa"/>
    <circle cx="134" cy="114" r="5" fill="#67e8f9"/>
    <circle cx="1146" cy="446" r="5" fill="#2dd4bf"/>
    <circle cx="134" cy="446" r="5" fill="#67e8f9"/>
  </g>

  <text x="140" y="170" fill="#67e8f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" letter-spacing="6">DIGITAL WORKFLOW ARCHITECT</text>
  <text x="136" y="248" fill="url(#name)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="84" font-weight="900" letter-spacing="-2">Tayeb Jalili</text>
  <text x="142" y="296" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24">Full-stack developer building future-ready systems for real institutions.</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="142" y="342" width="132" height="40" rx="20" fill="#67e8f9" fill-opacity="0.12" stroke="#67e8f9" stroke-opacity="0.38"/>
    <text x="208" y="368" text-anchor="middle" fill="#a5f3fc" font-size="15" font-weight="700">Laravel</text>
    <rect x="290" y="342" width="112" height="40" rx="20" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.38"/>
    <text x="346" y="368" text-anchor="middle" fill="#99f6e4" font-size="15" font-weight="700">React</text>
    <rect x="418" y="342" width="112" height="40" rx="20" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.38"/>
    <text x="474" y="368" text-anchor="middle" fill="#ddd6fe" font-size="15" font-weight="700">Node.js</text>
    <rect x="546" y="342" width="104" height="40" rx="20" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.38"/>
    <text x="598" y="368" text-anchor="middle" fill="#bae6fd" font-size="15" font-weight="700">MySQL</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" fill="#94a3b8" font-size="14">
    <text x="144" y="442">MODE: CLARITY OVER CHAOS</text>
    <text x="414" y="442">MISSION: SOFTWARE THAT PEOPLE ACTUALLY USE</text>
  </g>
</svg>
